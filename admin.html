<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDN — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0a0a0a; --surface: #111111; --card: #1a1a1a;
      --border:  #2a2a2a; --gold: #c9a84c;    --white: #ffffff;
      --gray:    #888888; --danger: #e05555;  --success: #25D366;
      --radius:  8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--white); min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; }

    /* Login */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a1408 0%, var(--bg) 70%);
    }
    .login-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 3rem 2.5rem; width: min(420px, 90vw); text-align: center;
      animation: fadeInUp 0.6s ease both;
    }
    .login-logo { font-size: 3rem; font-weight: 900; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 0.5rem; }
    .login-subtitle { font-size: 0.7rem; letter-spacing: 0.4em; color: var(--gray); text-transform: uppercase; margin-bottom: 2.5rem; }
    .login-box label { display: block; font-size: 0.65rem; letter-spacing: 0.3em; color: var(--gray); text-transform: uppercase; text-align: left; margin-bottom: 0.5rem; }
    .login-box input { width: 100%; padding: 0.85rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--white); font-size: 1rem; outline: none; transition: border-color 0.3s; margin-bottom: 1.5rem; }
    .login-box input:focus { border-color: var(--gold); }
    .btn-login { width: 100%; padding: 0.9rem; background: var(--gold); color: var(--bg); border: none; border-radius: var(--radius); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; transition: background 0.3s, transform 0.2s; }
    .btn-login:hover { background: #e0bc60; transform: translateY(-2px); }
    .login-error { color: var(--danger); font-size: 0.8rem; margin-top: 1rem; display: none; }

    /* Dashboard */
    #dashboard { display: none; }
    .admin-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .admin-header-left { display: flex; align-items: center; gap: 1rem; }
    .admin-logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.25em; color: var(--gold); }
    .admin-title { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--gray); text-transform: uppercase; }
    .btn-logout { padding: 0.5rem 1.5rem; background: transparent; border: 1px solid var(--border); color: var(--gray); border-radius: var(--radius); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; transition: border-color 0.3s, color 0.3s; }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
    .admin-main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }
    .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    .admin-card-title { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.65rem; letter-spacing: 0.25em; color: var(--gray); text-transform: uppercase; margin-bottom: 0.5rem; }
    .form-control { width: 100%; padding: 0.75rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--white); font-size: 0.9rem; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: var(--gold); }
    .upload-label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; padding: 1.5rem; border: 2px dashed var(--border); border-radius: var(--radius); cursor: pointer; transition: border-color 0.3s, background 0.3s; text-align: center; }
    .upload-label:hover { border-color: var(--gold); background: rgba(201,168,76,0.04); }
    .upload-label input { display: none; }
    .upload-label .icon { font-size: 1.8rem; opacity: 0.5; }
    .upload-label .text { font-size: 0.75rem; color: var(--gray); }
    .upload-label .text span { color: var(--gold); }
    #img-preview { width: 100%; max-height: 160px; object-fit: contain; border-radius: var(--radius); margin-top: 0.75rem; display: none; background: var(--card); padding: 0.5rem; }
    .btn-add { width: 100%; padding: 0.9rem; background: var(--gold); color: var(--bg); border: none; border-radius: var(--radius); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; transition: background 0.3s, transform 0.2s; margin-top: 0.5rem; }
    .btn-add:hover { background: #e0bc60; transform: translateY(-2px); }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .products-list { display: flex; flex-direction: column; gap: 1rem; }
    .product-row { display: flex; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; animation: fadeInUp 0.4s ease both; }
    .product-thumb { width: 60px; height: 75px; object-fit: cover; border-radius: 4px; background: var(--surface); flex-shrink: 0; }
    .product-row-info { flex: 1; min-width: 0; }
    .product-row-name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-row-price { font-size: 0.85rem; color: var(--gold); font-weight: 600; margin-top: 2px; }
    .product-row-cat { font-size: 0.65rem; color: var(--gray); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 2px; }
    .btn-delete { padding: 0.5rem 1rem; background: transparent; border: 1px solid var(--border); color: var(--gray); border-radius: var(--radius); font-size: 0.7rem; letter-spacing: 0.1em; transition: border-color 0.3s, color 0.3s, background 0.3s; flex-shrink: 0; }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); background: rgba(224,85,85,0.08); }
    .empty-products { text-align: center; padding: 3rem 1rem; color: var(--gray); font-size: 0.85rem; }
    .empty-products .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
    .products-count { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--gray); text-transform: uppercase; margin-bottom: 1rem; }
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--gold); }
    .stat-label { font-size: 0.6rem; letter-spacing: 0.3em; color: var(--gray); text-transform: uppercase; margin-top: 0.25rem; }

    /* Firebase status banner */
    .firebase-status {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 0.75rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .firebase-status.connected { border-color: var(--success); color: var(--success); }
    .firebase-status.error     { border-color: var(--danger);  color: var(--danger); }
    .firebase-status.loading   { border-color: var(--gold);    color: var(--gold); }

    /* Upload progress */
    .upload-progress { margin-top: 0.5rem; display: none; }
    .upload-progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .upload-progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s; }
    .upload-progress-text { font-size: 0.65rem; color: var(--gray); margin-top: 0.3rem; text-align: center; }

    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9000; display: flex; flex-direction: column; gap: 0.75rem; }
    .toast { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 0.9rem 1.4rem; border-radius: var(--radius); font-size: 0.82rem; min-width: 220px; animation: slideInRight 0.4s ease, fadeOut 0.4s 2.6s ease forwards; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .toast.success { border-left-color: var(--success); }
    .toast.error   { border-left-color: var(--danger); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }

    @media (max-width: 800px) { .admin-main { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .admin-header { padding: 1rem; } .admin-main { padding: 1.5rem 1rem; } .stats-bar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">SDN</div>
      <p class="login-subtitle">Admin Dashboard</p>
      <label for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="Enter admin password" autocomplete="current-password" />
      <button class="btn-login" id="login-btn">Login</button>
      <p class="login-error" id="login-error">Incorrect password. Please try again.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <header class="admin-header">
      <div class="admin-header-left">
        <span class="admin-logo">SDN</span>
        <span class="admin-title">Admin Dashboard</span>
      </div>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </header>

    <main class="admin-main">
      <!-- LEFT: Add Product -->
      <div>
        <div class="stats-bar">
          <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Products</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-cats">0</div><div class="stat-label">Categories</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-avg">—</div><div class="stat-label">Avg Price</div></div>
        </div>

        <!-- Firebase connection status -->
        <div class="firebase-status loading" id="firebase-status">
          ⏳ Connecting to database...
        </div>

        <div class="admin-card">
          <h2 class="admin-card-title">Add New Product</h2>
          <div class="form-group">
            <label for="p-name">Product Name *</label>
            <input type="text" class="form-control" id="p-name" placeholder="e.g. Classic Black Tee" />
          </div>
          <div class="form-group">
            <label for="p-price">Price (EGP) *</label>
            <input type="number" class="form-control" id="p-price" placeholder="e.g. 350" min="0" step="0.01" />
          </div>
          <div class="form-group">
            <label for="p-category">Category (optional)</label>
            <input type="text" class="form-control" id="p-category" placeholder="e.g. Oversized, Graphic, Basic" />
          </div>
          <div class="form-group">
            <label>Product Image *</label>
            <label class="upload-label" for="p-image">
              <div class="icon">🖼️</div>
              <p class="text">Click to upload image<br><span>PNG, JPG, WEBP — max 5MB</span></p>
              <input type="file" id="p-image" accept="image/*" />
            </label>
            <img id="img-preview" alt="Preview" />
            <div class="upload-progress" id="upload-progress">
              <div class="upload-progress-bar"><div class="upload-progress-fill" id="progress-fill"></div></div>
              <p class="upload-progress-text" id="progress-text">Uploading...</p>
            </div>
          </div>
          <button class="btn-add" id="add-product-btn">+ Add Product</button>
        </div>
      </div>

      <!-- RIGHT: Products List -->
      <div class="admin-card">
        <h2 class="admin-card-title">Products List</h2>
        <p class="products-count" id="products-count">Loading...</p>
        <div class="products-list" id="products-list">
          <div class="empty-products"><div class="icon">⏳</div><p>Loading products...</p></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // ============================================================
    // TODO: Change this password
    const ADMIN_PASSWORD = "SDNAdmin2026";
    const SESSION_KEY    = "sdn_admin_logged_in";

    // ============================================================
    // JSONBIN CONFIG
    // ============================================================
    const JSONBIN_ID  = "6a09fa45adc21f119ab4482a";
    const JSONBIN_KEY = "$2a$10$2gTK/oZFFostkxKG3TxlmefFpuNjDgxmY9duPVOaO4vlQLTNbDWFS";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

    // ---- Utility ----
    function showToast(msg, type = "default") {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }
    function formatCurrency(v) {
      const n = parseFloat(v);
      return isNaN(n) ? v : (n % 1 === 0 ? `${n} EGP` : `${n.toFixed(2)} EGP`);
    }
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }
    function setStatus(msg, type) {
      const el = document.getElementById("firebase-status");
      el.textContent = msg;
      el.className = `firebase-status ${type}`;
    }

    // ---- JSONBin helpers ----
    let _products = [];

    async function loadProducts() {
      setStatus("⏳ Loading products...", "loading");
      try {
        const res = await fetch(JSONBIN_URL + "/latest", {
          headers: { "X-Access-Key": JSONBIN_KEY }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const raw  = data.record;
        _products  = Array.isArray(raw) ? raw
                   : Array.isArray(raw?.products) ? raw.products
                   : [];
        setStatus("✅ Connected — products loaded", "connected");
        renderProducts();
        updateStats();
      } catch (err) {
        setStatus("❌ Error: " + err.message, "error");
        showToast("Failed to load products: " + err.message, "error");
      }
    }

    async function saveProducts() {
      const res = await fetch(JSONBIN_URL, {
        method:  "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key":  JSONBIN_KEY
        },
        body: JSON.stringify({ products: _products })
      });
      if (!res.ok) throw new Error("Save failed: HTTP " + res.status);
    }

    // ---- Auth ----
    const loginScreen = document.getElementById("login-screen");
    const dashboard   = document.getElementById("dashboard");
    const loginBtn    = document.getElementById("login-btn");
    const logoutBtn   = document.getElementById("logout-btn");
    const pwInput     = document.getElementById("password-input");
    const loginError  = document.getElementById("login-error");

    if (localStorage.getItem(SESSION_KEY) === "true") showDashboard();

    loginBtn.addEventListener("click", doLogin);
    pwInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

    function doLogin() {
      if (pwInput.value === ADMIN_PASSWORD) {
        localStorage.setItem(SESSION_KEY, "true");
        loginError.style.display = "none";
        showDashboard();
      } else {
        loginError.style.display = "block";
        pwInput.value = "";
        pwInput.focus();
        pwInput.style.borderColor = "var(--danger)";
        setTimeout(() => { pwInput.style.borderColor = ""; }, 1500);
      }
    }

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      location.reload();
    });

    // ---- Image Upload Preview ----
    let imageBase64 = null;
    const imgInput   = document.getElementById("p-image");
    const imgPreview = document.getElementById("img-preview");

    imgInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast("Image too large. Max 5MB.", "error");
        imgInput.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = ev => {
        imageBase64 = ev.target.result;
        imgPreview.src = imageBase64;
        imgPreview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    // ---- Add Product ----
    document.getElementById("add-product-btn").addEventListener("click", async () => {
      const name     = document.getElementById("p-name").value.trim();
      const price    = document.getElementById("p-price").value.trim();
      const category = document.getElementById("p-category").value.trim();
      const addBtn   = document.getElementById("add-product-btn");

      if (!name)  { showToast("Product name is required.", "error"); return; }
      if (!price) { showToast("Price is required.", "error"); return; }
      if (isNaN(parseFloat(price)) || parseFloat(price) < 0) {
        showToast("Enter a valid price.", "error"); return;
      }
      if (!imageBase64) { showToast("Please upload a product image.", "error"); return; }

      addBtn.disabled    = true;
      addBtn.textContent = "Saving...";

      const progressEl = document.getElementById("upload-progress");
      const fillEl     = document.getElementById("progress-fill");
      const textEl     = document.getElementById("progress-text");
      progressEl.style.display = "block";
      fillEl.style.width = "40%";
      textEl.textContent = "Saving product...";

      try {
        const product = {
          id:        generateId(),
          name,
          price:     parseFloat(price),
          category:  category || "",
          image:     imageBase64,   // stored as base64 in JSONBin
          createdAt: new Date().toISOString()
        };

        _products.unshift(product);   // newest first
        fillEl.style.width = "70%";

        await saveProducts();

        fillEl.style.width = "100%";
        textEl.textContent = "Done!";

        // Reset form
        document.getElementById("p-name").value     = "";
        document.getElementById("p-price").value    = "";
        document.getElementById("p-category").value = "";
        imgInput.value = "";
        imgPreview.style.display = "none";
        imgPreview.src = "";
        imageBase64 = null;

        setTimeout(() => {
          progressEl.style.display = "none";
          fillEl.style.width = "0%";
        }, 1000);

        renderProducts();
        updateStats();
        showToast(`"${name}" added successfully!`, "success");

      } catch (err) {
        showToast("Error saving: " + err.message, "error");
        setStatus("❌ Save error — " + err.message, "error");
        // rollback
        _products.shift();
      } finally {
        addBtn.disabled    = false;
        addBtn.textContent = "+ Add Product";
      }
    });

    // ---- Delete Product ----
    async function deleteProduct(id) {
      if (!confirm("Delete this product? This cannot be undone.")) return;
      try {
        _products = _products.filter(p => p.id !== id);
        await saveProducts();
        renderProducts();
        updateStats();
        showToast("Product deleted.", "default");
      } catch (err) {
        showToast("Error deleting: " + err.message, "error");
        await loadProducts(); // reload to restore correct state
      }
    }
    window.deleteProduct = deleteProduct;

    // ---- Render Products ----
    function renderProducts() {
      const list    = document.getElementById("products-list");
      const countEl = document.getElementById("products-count");
      countEl.textContent = `${_products.length} product${_products.length !== 1 ? "s" : ""}`;

      if (_products.length === 0) {
        list.innerHTML = `<div class="empty-products"><div class="icon">👕</div><p>No products yet. Add your first product!</p></div>`;
        return;
      }

      const fallback = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='75'><rect width='60' height='75' fill='%231a1a1a'/><text x='30' y='42' text-anchor='middle' fill='%23c9a84c' font-size='12' font-weight='bold'>SDN</text></svg>`;

      list.innerHTML = _products.map((p, i) => `
        <div class="product-row" style="animation-delay:${i * 0.05}s">
          <img class="product-thumb" src="${p.image || fallback}" alt="${p.name}"
            onerror="this.src='${fallback}'" />
          <div class="product-row-info">
            <p class="product-row-name">${p.name}</p>
            <p class="product-row-price">${formatCurrency(p.price)}</p>
            ${p.category ? `<p class="product-row-cat">${p.category}</p>` : ""}
          </div>
          <button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      `).join("");
    }

    // ---- Stats ----
    function updateStats() {
      const cats = new Set(_products.map(p => p.category).filter(Boolean));
      const avg  = _products.length
        ? _products.reduce((s, p) => s + (parseFloat(p.price) || 0), 0) / _products.length : 0;
      document.getElementById("stat-total").textContent = _products.length;
      document.getElementById("stat-cats").textContent  = cats.size;
      document.getElementById("stat-avg").textContent   = _products.length
        ? Math.round(avg) + " EGP" : "—";
    }

    // ---- Show Dashboard ----
    function showDashboard() {
      loginScreen.style.display = "none";
      dashboard.style.display   = "block";
      loadProducts();
    }
  </script>
</body>
</html>
